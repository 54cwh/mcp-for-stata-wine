[DEBUG]
IS_DEBUG = false

[DEBUG.logging]
LOGGING_ON = true
LOGGING_CONSOLE_HANDLER_ON = false
LOGGING_FILE_HANDLER_ON = true
LOG_FILE = "~/.statamcp/stata_mcp_debug.log"
MAX_BYTES = 10_000_000
BACKUP_COUNT = 5

[BETA]
IS_ASYNC_DO = false
MAX_ASYNC_DO = 3
enable_data_info_url_guard = false
data_info_allowed_url_domains = []
enable_structured_log = false
# Windows only: re-enable the get_data_info MCP tool, which is hidden on
# Windows by default due to a known Windows-only MCP-wrapper bug.
enable_windows_data_info = false

[HELP]
IS_CACHE = true
IS_SAVE = true
# Extra ado directories scanned for .sthlp files (comma-separated). Useful for
# community packages installed outside the Stata installation / user ado tree.
ADDITIONAL_PATHS = []

[SECURITY]
IS_GUARD = true
ADO_INSTALL_ALLOWED_GITHUB_REPOSITORIES = []
# When true, GuardValidator scans dofiles for data-loading commands and
# rejects paths/URLs that violate the same rules as get_data_info.
enable_data_command_path_guard = false
strict_data_info_local_boundary = false
strict_read_log_boundary = false

[PROJECT]
WORKING_DIR = ""
CLEAN_LOG_DAYS = -1
FOLDER_TAG = ".statamcp"

[MONITOR]
IS_MONITOR = false
MAX_RAM_MB = -1

[data_info]
metrics = ["obs", "mean", "stderr", "min", "max", "q1", "q3", "skewness", "kurtosis"]string_keep_number = 10
decimal_places = 3
hash_length = 12

[GRAPH]
# Export graphs created during a Wine/batch run into
# <log folder>/graphs/<log name>/ and report them in the `stata_do` result.
EXPORT = true
# png, svg, or both.
FORMAT = "png"
# Pixel width for raster exports (png/jpg/tif); 0 keeps Stata's default.
WIDTH = 0

[STATA]
# Command the server spawns to run Stata. Leave empty to auto-detect a native
# install. For Wine, point this at the bundled bridge, e.g. "scripts/stata-wine".
STATA_CLI = ""
# Drive a *Windows* Stata build through Wine (Linux, and macOS without a native
# build). Requires STATA_CLI to be a wine bridge script; see README "Wine Mode".
IS_WINE = false
# Wine prefix holding the Windows Stata install. Used under IS_WINE to locate
# the installation's .sthlp files for the local `help` backend
# (default: $WINEPREFIX, then ~/.wine).
WINE_PREFIX = ""
# Optional Windows Stata executable inside the prefix. When empty, the ado tree
# is discovered from "Program Files/Stata*/ado" (default: empty).
WINE_STATA_EXE = ""
